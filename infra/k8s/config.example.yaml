apiVersion: v1
kind: ConfigMap
metadata: { name: spheric-config, namespace: spheric-agents }
data:
  NODE_ENV: production
  API_PORT: "4000"
  WEB_ORIGIN: https://agents.spheric.media
  API_INTERNAL_URL: http://spheric-api
  COOKIE_SECURE: "true"
  ACCESS_TOKEN_TTL_SECONDS: "3600"
  REFRESH_TOKEN_TTL_DAYS: "30"
  OPENAI_MODEL: gpt-5.6-terra
  AUTO_RESEARCH_ENABLED: "false"
  RESEARCH_INTERVAL_MS: "21600000"
  DB_POOL_MAX: "20"
  DB_CONNECT_TIMEOUT_MS: "10000"
  AGENT_WORKER_CONCURRENCY: "3"
  PUBLISH_WORKER_CONCURRENCY: "5"
  ANALYTICS_WORKER_CONCURRENCY: "5"
  PUBLISH_RATE_MAX: "30"
  PUBLISH_RATE_WINDOW_MS: "60000"
  LOG_LEVEL: info
# Create Secret spheric-secrets using an external-secret controller. It should provide at least
# DATABASE_URL, REDIS_URL, JWT_SECRET, DATA_ENCRYPTION_KEY and OPENAI_API_KEY. Do not commit plaintext.
