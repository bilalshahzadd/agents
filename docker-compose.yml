services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spheric
      POSTGRES_PASSWORD: spheric
      POSTGRES_DB: spheric
    ports: ["5432:5432"]
    volumes: ["spheric_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spheric -d spheric"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["spheric_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  spheric_pg:
  spheric_redis:
